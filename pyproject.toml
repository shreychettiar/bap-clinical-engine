[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bap-clinical-engine"
version = "1.0.0"
description = "Balanced Activity Profile (BAP) clinical scoring engine, dual-anchor baseline model, and interactive clinician dashboard."
readme = "README.md"
authors = [{ name = "Shrey Chettiar", email = "shreychettiar@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
